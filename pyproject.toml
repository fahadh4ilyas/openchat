[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ochat"
description = "An efficient framework for training and serving top-tier, open-source conversational LLMs."
readme = "README.md"
requires-python = ">=3.8"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "tqdm", 
    "mlflow", 
    "numba", 
    "orjson", 
    "torch==2.11.0", 
    "sentencepiece", 
    "transformers==5.3.0",
    "peft==0.18.1",
    "bitsandbytes==0.49.2",
    "accelerate==1.13.0", 
    "protobuf",
    "pydantic"
]

[project.urls]
"Homepage" = "https://github.com/imoneoi/openchat"
"Bug Tracker" = "https://github.com/imoneoi/openchat/issues"

[tool.setuptools.packages.find]
exclude = ["assets*", "ochat/experimental*"]

[tool.wheel]
exclude = ["assets*", "ochat/experimental*"]

[tool.setuptools_scm]
